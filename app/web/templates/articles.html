{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>文章</h2>
  <table>
    <tr><th>ID</th><th>标题</th><th>类型</th><th>日期</th><th>状态</th><th>草稿</th></tr>
    {% for article in articles %}
    <tr>
      <td>{{ article.id }}</td>
      <td><a href="/articles/{{ article.id }}">{{ article.title }}</a></td>
      <td>{{ article.content_type }}</td>
      <td>{{ article.date }}</td>
      <td>{{ article.status }}</td>
      <td>{{ "已创建" if article.draft_id else "-" }}</td>
    </tr>
    {% endfor %}
  </table>
</section>
{% endblock %}
