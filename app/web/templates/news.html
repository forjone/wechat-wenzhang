{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>新闻源</h2>
  <form method="post" action="/news/collect">
    <input type="date" name="date" value="{{ date }}" required>
    <button type="submit">采集这天新闻</button>
  </form>
</section>
<section class="card">
  <table>
    <tr><th>标题</th><th>来源</th><th>摘要</th><th>分数</th><th>操作</th></tr>
    {% for source in sources %}
    <tr>
      <td><a href="{{ source.url }}" target="_blank">{{ source.title }}</a></td>
      <td>{{ source.source }}</td>
      <td>{{ source.summary }}</td>
      <td>{{ source.score }}</td>
      <td><a class="button" href="/news/{{ source.id }}/generate">生成文章</a></td>
    </tr>
    {% endfor %}
  </table>
</section>
{% endblock %}
