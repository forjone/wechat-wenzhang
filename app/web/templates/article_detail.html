{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>{{ article.title }}</h2>
  <p class="muted">类型：{{ article.content_type }} ｜ 日期：{{ article.date }} ｜ 状态：{{ article.status }} ｜ 草稿：{{ article.draft_id or '-' }}</p>
</section>
<section class="card">
  <h3>Markdown</h3>
  <pre>{{ article.content_markdown }}</pre>
</section>
<section class="card">
  <h3>HTML 预览</h3>
  <div class="html-preview">{{ article.content_html | safe }}</div>
</section>
{% endblock %}
